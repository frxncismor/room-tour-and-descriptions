<div class="viewer-container">
  <!-- DOM order = Tab order: help -> list -> "Initial view" -> canvas.
       All three are absolutely positioned, so their DOM position does not
       change the layout. -->
  @if (!blockingError()) {
    <app-brand-label />
    <app-help-panel [suppressed]="!!state.selected()" [seen]="interacted()" />
    <app-object-list
      [items]="objects()"
      [selectedName]="state.selected()?.name ?? null"
      (selectItem)="selectObject($event)"
      (resetView)="resetView()"
    />
  }

  <canvas
    #canvas
    class="scene-canvas"
    role="img"
    tabindex="0"
    [attr.aria-label]="canvasLabel"
    [style.cursor]="cursor()"
    (pointerdown)="onPointerDown($event)"
    (pointermove)="onPointerMove($event)"
    (pointerup)="onPointerUp($event)"
    (pointercancel)="onPointerCancel($event)"
    (pointerleave)="onPointerLeave($event)"
    (keydown.home)="onHome($event)"
    (keydown)="onCanvasKey($event)"
    (wheel)="interacted.set(true)"
  ></canvas>

  @if (blockingError(); as error) {
    <app-error-overlay [error]="error" />
  } @else {
    <app-loading-screen />

    @if (bannerError(); as error) {
      <app-error-banner [error]="error" (retry)="retry()" />
    }

    <app-description-panel [info]="panelInfo()" (closed)="closePanel()" />
  }
</div>
