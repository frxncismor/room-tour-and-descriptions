<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Room Tour — UI mockup (spec 003)</title>
    <!--
      Static mockup of the UI with the EN/ES language switcher. Not the app: the 3D scene is a flat schematic.
      Language: ?lang=en|es (default en). Screen: #overview (default) #help #detail.
      Layout switches by viewport: desktop >600px wide, mobile <=600px wide (use mobile-frame.html for 390x844).
      Tokens are the real ones from src/styles.scss.
    -->
    <style>
      @font-face {
        font-family: 'Fraunces';
        font-style: normal;
        font-weight: 300 700;
        src: url('../../002-decoracion-y-ui/mockups/fonts/fraunces-var-latin.woff2')
          format('woff2');
      }
      @font-face {
        font-family: 'Hanken Grotesk';
        font-style: normal;
        font-weight: 400 600;
        src: url('../../002-decoracion-y-ui/mockups/fonts/hanken-grotesk-var-latin.woff2')
          format('woff2');
      }
      :root {
        --paper: #f6efe4;
        --paper-sunk: #ece2d1;
        --ink: #2a2420;
        --ink-muted: #5c5046;
        --rule: #d8cab6;
        --rule-strong: #8c7d6e;
        --clay: #8a4426;
        --clay-hover: #733820;
        --teal: #35544f;
        --focus: var(--teal);
        --font-display: 'Fraunces', Georgia, serif;
        --font-text: 'Hanken Grotesk', system-ui, 'Segoe UI', sans-serif;
        --fs-label: 0.75rem;
        --fs-small: 0.8125rem;
        --fs-body: 0.9375rem;
        --fs-title: 1.375rem;
        --space-1: 0.25rem;
        --space-2: 0.5rem;
        --space-3: 0.75rem;
        --space-4: 1rem;
        --space-5: 1.5rem;
        --space-6: 2rem;
        --radius-1: 2px;
        --radius-2: 4px;
        --shadow-panel:
          0 1px 2px rgb(42 36 32 / 0.08), 0 12px 28px -14px rgb(42 36 32 / 0.35);
        --hit: 44px;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
      }
      body {
        font-family: var(--font-text);
        font-size: var(--fs-body);
        line-height: 1.5;
        color: var(--ink);
        background: var(--paper);
      }
      h1,
      h2 {
        margin: 0;
        font-family: var(--font-display);
        font-weight: 500;
        line-height: 1.2;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0;
      }
      button {
        font: inherit;
        color: inherit;
      }
      :focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 2px;
      }

      /* ---------- schematic backdrop (warm: spec 003 §B) ---------- */
      .scene {
        position: fixed;
        inset: 0;
        overflow: hidden;
        background: #a98763;
      }
      .scene > * {
        position: absolute;
      }
      .back {
        left: 18%;
        right: 0;
        top: 0;
        height: 47%;
        background: #6f8f8c;
      }
      .back::before,
      .back::after {
        content: '';
        position: absolute;
        top: 18%;
        width: 16%;
        height: 60%;
        background: radial-gradient(
          ellipse at 50% 40%,
          rgb(255 205 140 / 0.38),
          transparent 68%
        );
      }
      .back::before {
        left: 38%;
      }
      .back::after {
        left: 52%;
      }
      .ceil {
        left: 0;
        right: 0;
        top: 0;
        height: 11%;
        background: linear-gradient(#a8917a, #b69f86);
      }
      .side {
        left: 0;
        top: 0;
        width: 22%;
        height: 61%;
        background: #dcc7b0;
        clip-path: polygon(0 0, 100% 12%, 100% 78%, 0 100%);
      }
      .win {
        left: 7.5%;
        top: 25%;
        width: 8%;
        height: 30%;
        background: linear-gradient(#e9bb86, #fbe5bd);
        outline: 3px solid #fbf7ef;
        transform: skewY(5deg);
        box-shadow: 0 0 42px 12px rgb(255 214 160 / 0.55);
      }
      .cur {
        top: 20%;
        width: 3.4%;
        height: 46%;
        background: repeating-linear-gradient(
          90deg,
          #8f9d82 0 6px,
          #7f8e73 6px 8px
        );
        transform: skewY(5deg);
      }
      .cur.a {
        left: 4.2%;
      }
      .cur.b {
        left: 15.2%;
      }
      .floor {
        left: 0;
        right: 0;
        top: 47%;
        bottom: 0;
        background:
          repeating-linear-gradient(
            90deg,
            transparent 0 78px,
            rgb(60 40 20 / 0.08) 78px 79px
          ),
          linear-gradient(#b08e63, #8f7050);
      }
      .rug {
        left: 22%;
        top: 62%;
        width: 36%;
        height: 24%;
        background: #a8896a;
        transform: skewX(-24deg);
        box-shadow: inset 0 0 0 6px rgb(255 240 215 / 0.12);
      }
      .sofa {
        left: 24%;
        top: 49%;
        width: 26%;
        height: 20%;
        background: #a65f3a;
        border-radius: 6px 6px 2px 2px;
        box-shadow: inset 0 -14px 0 rgb(0 0 0 / 0.12);
      }
      .cush {
        top: 51%;
        width: 3.6%;
        height: 7%;
        border-radius: 5px;
        transform: rotate(-6deg);
      }
      .cush.a {
        left: 27%;
        background: #eadfcb;
      }
      .cush.b {
        left: 44%;
        background: #94a283;
        transform: rotate(7deg);
      }
      .throw {
        left: 31%;
        top: 57%;
        width: 9%;
        height: 8%;
        background: #c18f45;
        border-radius: 3px 3px 10px 10px;
        opacity: 0.95;
      }
      .ottoman {
        left: 33%;
        top: 70%;
        width: 9%;
        height: 7%;
        background: #a65f3a;
        border-radius: 4px;
      }
      .shelf {
        left: 61%;
        top: 14%;
        width: 8%;
        height: 36%;
        background: repeating-linear-gradient(
          #3b2a20 0 14px,
          #5a4333 14px 17px
        );
      }
      .painting {
        left: 38%;
        top: 14%;
        width: 9%;
        height: 14%;
        background: linear-gradient(#b7a27a, #6d7d55);
        outline: 5px solid #b8944f;
        outline-offset: -1px;
      }
      .print {
        top: 13%;
        width: 3.6%;
        height: 17%;
        background: #f4efe6 center/70% 78% no-repeat;
        outline: 4px solid #1f1b18;
        outline-offset: -1px;
      }
      .print.a {
        left: 21%;
        background-image: url('art/spiraea.webp');
      }
      .print.b {
        left: 94%;
        background-image: url('art/felce.webp');
      }
      .clock {
        left: 80%;
        top: 15%;
        width: 5.4%;
        aspect-ratio: 1;
        background: #f1ede6;
        border: 4px solid #4b5256;
        border-radius: 50%;
      }
      .sconce {
        top: 22%;
        width: 1.3%;
        height: 4%;
        background: #ffe2b0;
        border: 2px solid #a8823f;
        border-radius: 2px 2px 8px 8px;
        box-shadow: 0 0 26px 10px rgb(255 205 140 / 0.5);
      }
      .sconce.a {
        left: 56%;
      }
      .sconce.b {
        left: 74%;
      }
      .lamp {
        left: 17.5%;
        top: 36%;
        width: 2.4%;
        height: 12%;
        background:
          linear-gradient(#ffe2b0 0 38%, transparent 38%),
          linear-gradient(
            90deg,
            transparent 46%,
            #a8823f 46% 54%,
            transparent 54%
          );
        box-shadow: 0 -10px 60px 14px rgb(255 205 140 / 0.35);
      }
      .plant {
        left: 70.5%;
        top: 40%;
        width: 3%;
        height: 10%;
        background:
          radial-gradient(ellipse at 50% 25%, #4d7048 0 55%, transparent 56%),
          linear-gradient(transparent 55%, #d8d2c8 55%);
      }
      .vase {
        left: 56%;
        top: 38%;
        width: 3.4%;
        height: 12%;
        background: #dcd6cb;
        border-radius: 40% 40% 30% 30%;
      }
      .caption {
        right: 8px;
        bottom: 4px;
        font-size: 10px;
        color: rgb(255 255 255 / 0.6);
        pointer-events: none;
      }

      .screen {
        display: none;
      }
      .screen:target,
      body:not(:has(:target)) #overview {
        display: block;
      }

      /* bottom-left corner: brand plate + language switcher (NEW) */
      .corner {
        position: fixed;
        left: var(--space-4);
        bottom: var(--space-4);
        display: flex;
        align-items: stretch;
        gap: var(--space-2);
      }
      .brand {
        padding: var(--space-2) var(--space-3);
        background: var(--paper);
        border: 1px solid var(--rule);
        border-radius: var(--radius-2);
        box-shadow: var(--shadow-panel);
      }
      .brand strong {
        display: block;
        font-family: var(--font-display);
        font-size: 1.125rem;
        font-weight: 500;
        line-height: 1.2;
      }
      .brand span {
        font-size: var(--fs-label);
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--ink-muted);
      }
      .lang {
        display: flex;
        background: var(--paper);
        border: 1px solid var(--rule-strong);
        border-radius: var(--radius-1);
        box-shadow: var(--shadow-panel);
      }
      .lang button {
        min-width: var(--hit);
        min-height: var(--hit);
        padding: 0 var(--space-3);
        background: none;
        border: 0;
        font-size: var(--fs-small);
        font-weight: 600;
        letter-spacing: 0.06em;
        cursor: pointer;
        color: var(--ink);
      }
      .lang button + button {
        border-left: 1px solid var(--rule);
      }
      .lang button:hover {
        background: var(--paper-sunk);
      }
      .lang button[aria-pressed='true'] {
        background: var(--teal);
        color: var(--paper);
      }
      .sr {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }

      .list {
        position: fixed;
        left: var(--space-4);
        top: var(--space-4);
        width: 232px;
        background: var(--paper);
        border: 1px solid var(--rule);
        border-radius: var(--radius-2);
        box-shadow: var(--shadow-panel);
      }
      .list h2 {
        padding: var(--space-3) var(--space-4) var(--space-2);
        font-family: var(--font-text);
        font-size: var(--fs-label);
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--ink-muted);
      }
      .list ul {
        margin: 0;
        padding: 0 0 var(--space-1);
        list-style: none;
      }
      .chip {
        display: flex;
        align-items: center;
        width: 100%;
        min-height: 36px;
        padding: 0 var(--space-4);
        background: none;
        border: 0;
        border-left: 3px solid transparent;
        text-align: left;
        cursor: pointer;
      }
      .chip[aria-pressed='true'] {
        border-left-color: var(--clay);
        background: var(--paper-sunk);
        font-weight: 600;
      }
      .chip.reset {
        gap: var(--space-2);
        min-height: 40px;
        border-top: 1px solid var(--rule);
        color: var(--clay);
        font-weight: 500;
      }

      .panel {
        position: fixed;
        top: var(--space-4);
        right: var(--space-4);
        width: 360px;
        padding: var(--space-5);
        background: var(--paper);
        border: 1px solid var(--rule);
        border-radius: var(--radius-2);
        box-shadow: var(--shadow-panel);
      }
      .panel h2 {
        padding-right: var(--space-6);
        font-size: var(--fs-title);
      }
      .panel .body {
        margin-top: var(--space-3);
      }
      .panel .credit {
        margin-top: var(--space-4);
        padding-top: var(--space-3);
        border-top: 1px solid var(--rule);
        font-size: var(--fs-small);
        color: var(--ink-muted);
      }
      .close {
        position: absolute;
        top: var(--space-2);
        right: var(--space-2);
        display: grid;
        place-items: center;
        width: var(--hit);
        height: var(--hit);
        background: none;
        border: 0;
        cursor: pointer;
        font-size: 20px;
      }

      .sheet {
        position: fixed;
        right: var(--space-4);
        bottom: var(--space-4);
        width: 380px;
        padding: var(--space-5);
        background: var(--paper);
        border: 1px solid var(--rule);
        border-radius: var(--radius-2);
        box-shadow: var(--shadow-panel);
      }
      .sheet h2 {
        font-size: var(--fs-title);
      }
      .sheet dl {
        margin: var(--space-4) 0 var(--space-5);
        display: grid;
        gap: var(--space-3);
        font-size: var(--fs-body);
      }
      .sheet dl > div {
        display: grid;
        grid-template-columns: 5.5rem 1fr;
        gap: var(--space-4);
      }
      .sheet dt {
        font-weight: 600;
      }
      .sheet dd {
        margin: 0;
        color: var(--ink-muted);
      }
      .primary {
        min-height: var(--hit);
        padding: 0 var(--space-5);
        background: var(--clay);
        color: var(--paper);
        border: 0;
        border-radius: var(--radius-1);
        font-weight: 600;
        cursor: pointer;
      }
      .reopen {
        position: fixed;
        right: var(--space-4);
        bottom: var(--space-4);
        min-height: var(--hit);
        padding: 0 var(--space-4);
        background: var(--paper);
        border: 1px solid var(--rule-strong);
        border-radius: var(--radius-1);
        font-weight: 500;
        cursor: pointer;
      }

      /* ---------- mobile (<= 600px) ---------- */
      @media (max-width: 600px), (max-height: 500px) {
        .list {
          left: 0;
          right: 0;
          top: 0;
          width: auto;
          border-width: 0 0 1px;
          border-radius: 0;
          box-shadow: none;
        }
        .list h2 {
          display: none;
        }
        .list ul {
          display: flex;
          overflow-x: auto;
          padding: 0;
          scrollbar-width: none;
        }
        .list li {
          flex: none;
        }
        .chip {
          width: auto;
          min-height: var(--hit);
          padding: 0 var(--space-4);
          border-left: 0;
          border-bottom: 3px solid transparent;
          white-space: nowrap;
        }
        .chip[aria-pressed='true'] {
          border-bottom-color: var(--clay);
          background: none;
        }
        .chip.reset {
          border-top: 0;
          border-left: 1px solid var(--rule);
        }
        .chip.reset .label {
          display: none;
        }
        /* language switcher stacks ABOVE the brand plate so it never collides with "Controls" at 360–390 px */
        .corner {
          left: var(--space-3);
          bottom: var(--space-3);
          flex-direction: column;
          align-items: flex-start;
        }
        .panel,
        .sheet {
          left: 0;
          right: 0;
          width: auto;
          padding: var(--space-4) var(--space-4) var(--space-5);
          border-width: 1px 0 0;
          border-radius: var(--radius-2) var(--radius-2) 0 0;
        }
        .panel {
          top: auto;
          bottom: 0;
          max-height: 34dvh;
          overflow: auto;
        }
        .sheet {
          bottom: 0;
        }
        .sheet dl {
          gap: var(--space-2);
          margin: var(--space-3) 0 var(--space-4);
        }
        .sheet dl > div {
          grid-template-columns: 4.8rem 1fr;
          gap: var(--space-3);
        }
        .sheet .primary {
          width: 100%;
        }
        .reopen {
          right: var(--space-3);
          bottom: var(--space-3);
        }
        .caption {
          display: none;
        }
        /* portrait crop of the same schematic: wider, shifted so the left wall + back wall show like the real mobile view */
        .scene {
          left: -95%;
          right: auto;
          width: 230%;
        }
      }
    </style>
  </head>
  <body>
    <div class="scene" aria-hidden="true">
      <div class="ceil"></div>
      <div class="back"></div>
      <div class="side"></div>
      <div class="win"></div>
      <div class="cur a"></div>
      <div class="cur b"></div>
      <div class="floor"></div>
      <div class="rug"></div>
      <div class="sofa"></div>
      <div class="cush a"></div>
      <div class="cush b"></div>
      <div class="throw"></div>
      <div class="ottoman"></div>
      <div class="shelf"></div>
      <div class="painting"></div>
      <div class="print a"></div>
      <div class="print b"></div>
      <div class="clock"></div>
      <div class="sconce a"></div>
      <div class="sconce b"></div>
      <div class="plant"></div>
      <div class="vase"></div>
      <div class="lamp"></div>
    </div>
    <div class="caption">Schematic backdrop, not the real render</div>

    <div id="ui">
      <nav class="list" data-t-aria="list.aria">
        <h2 data-t="list.title"></h2>
        <ul id="chips"></ul>
      </nav>

      <div class="corner">
        <div class="lang" role="group" data-t-aria="lang.group">
          <button
            type="button"
            lang="en"
            aria-pressed="false"
            data-lang="en"
            aria-label="English (EN)"
          >
            EN
          </button>
          <button
            type="button"
            lang="es"
            aria-pressed="false"
            data-lang="es"
            aria-label="Español (ES)"
          >
            ES
          </button>
        </div>
        <div class="brand">
          <strong>Room Tour</strong><span data-t="brand.byline"></span>
        </div>
        <p class="sr" role="status" id="live"></p>
      </div>

      <div class="screen" id="overview">
        <button class="reopen" data-t="help.open"></button>
      </div>

      <section class="sheet screen" id="help" aria-labelledby="ht">
        <h2 id="ht" data-t="help.title"></h2>
        <dl id="controls"></dl>
        <button class="primary" data-t="help.gotIt"></button>
      </section>

      <section class="panel screen" id="detail" aria-labelledby="dt">
        <button class="close" data-t-aria="panel.close">×</button>
        <h2 id="dt" data-t="f.name"></h2>
        <p class="body" data-t="f.description"></p>
        <p class="credit" data-t="f.details"></p>
      </section>
    </div>

    <script>
      const D = {
        en: {
          'list.title': 'Pieces',
          'list.aria': 'Pieces in the room',
          'brand.byline': 'by Francisco Moreno',
          'help.open': 'Controls',
          'help.title': 'Controls',
          'help.gotIt': 'Close',
          'panel.close': 'Close details',
          'lang.group': 'Language',
          'f.name': 'Landscape painting',
          'f.description':
            'Oil landscape of a mill and a river, in a gilt frame with beaded molding. It hangs on the back wall, lit by a spotlight.',
          'f.details':
            'Model: "Fancy Picture Frame 01" by Rob Tuytel and Rico Cilliers, Poly Haven (CC0).',
          chips: [
            'Bookshelf',
            'Landscape painting',
            'Poker table',
            'Potted succulent',
            'Sectional sofa',
          ],
          reset: 'Reset view',
          controls: [
            ['Orbit', 'Drag with the left mouse button'],
            ['Pan', 'Drag with the right button; arrow keys work too'],
            ['Zoom', 'Scroll the wheel'],
            ['Move', 'Click the floor to go there'],
            ['Inspect', 'Click a piece to read about it'],
            ['Keys', 'Esc closes details. Home resets the view.'],
          ],
          announce: 'Language: English',
        },
        es: {
          'list.title': 'Piezas',
          'list.aria': 'Piezas de la sala',
          'brand.byline': 'por Francisco Moreno',
          'help.open': 'Controles',
          'help.title': 'Controles',
          'help.gotIt': 'Cerrar',
          'panel.close': 'Cerrar detalles',
          'lang.group': 'Idioma',
          'f.name': 'Cuadro de paisaje',
          'f.description':
            'Paisaje al óleo con un molino y un río, en marco dorado con moldura de perlas. Cuelga en la pared del fondo, iluminado por un foco.',
          'f.details':
            'Modelo: "Fancy Picture Frame 01", de Rob Tuytel y Rico Cilliers, Poly Haven (CC0).',
          chips: [
            'Cuadro de paisaje',
            'Estantería',
            'Mesa de póker',
            'Sofá rinconera',
            'Suculenta en maceta',
          ],
          reset: 'Restablecer vista',
          controls: [
            ['Orbitar', 'Arrastra con el botón izquierdo del ratón'],
            [
              'Desplazar',
              'Arrastra con el botón derecho; también valen las flechas del teclado',
            ],
            ['Zoom', 'Gira la rueda del ratón'],
            ['Moverse', 'Haz clic en el suelo para ir allí'],
            ['Inspeccionar', 'Haz clic en una pieza para leer sobre ella'],
            ['Teclas', 'Esc cierra los detalles. Inicio restablece la vista.'],
          ],
          announce: 'Idioma: español',
        },
      };
      const q = new URLSearchParams(location.search);
      let lang = q.get('lang') === 'es' ? 'es' : 'en';
      const reset =
        '<svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M5 2 1.5 5.5 5 9M1.5 5.5H9.5a3 3 0 0 1 3 3V12"/></svg>';
      function render(announce) {
        const d = D[lang];
        document.documentElement.lang = lang;
        document
          .querySelectorAll('[data-t]')
          .forEach(e => (e.textContent = d[e.dataset.t]));
        document
          .querySelectorAll('[data-t-aria]')
          .forEach(e => e.setAttribute('aria-label', d[e.dataset.tAria]));
        document.getElementById('chips').innerHTML =
          d.chips
            .map(
              c =>
                `<li><button class="chip" aria-pressed="false">${c}</button></li>`
            )
            .join('') +
          `<li><button class="chip reset" aria-label="${d.reset}">${reset}<span class="label">${d.reset}</span></button></li>`;
        document.getElementById('controls').innerHTML = d.controls
          .map(([a, b]) => `<div><dt>${a}</dt><dd>${b}</dd></div>`)
          .join('');
        document
          .querySelectorAll('.lang button')
          .forEach(b =>
            b.setAttribute('aria-pressed', String(b.dataset.lang === lang))
          );
        if (announce) document.getElementById('live').textContent = d.announce;
      }
      document.querySelectorAll('.lang button').forEach(b =>
        b.addEventListener('click', () => {
          lang = b.dataset.lang;
          render(true);
        })
      );
      render(false);
    </script>
  </body>
</html>
