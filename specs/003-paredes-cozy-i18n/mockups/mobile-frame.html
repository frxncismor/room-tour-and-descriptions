<!doctype html>
<meta charset="utf-8" />
<title>Mobile frame (390x844)</title>
<!-- Wraps index.html in a real 390x844 viewport (headless browsers enforce a minimum window width). Use ?s=overview|help|detail&lang=en|es -->
<style>
  html,
  body {
    margin: 0;
    background: #222;
  }
  iframe {
    display: block;
    width: 390px;
    height: 844px;
    border: 0;
  }
</style>
<iframe id="f" title="mobile mockup"></iframe>
<script>
  const p = new URLSearchParams(location.search);
  document.getElementById('f').src =
    'index.html?lang=' +
    (p.get('lang') || 'en') +
    '#' +
    (p.get('s') || 'overview');
</script>
